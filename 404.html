<!DOCTYPE html>
<html data-theme="blue-future">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — ftl-themes</title>
<script>
  // GitHub Pages serves this file at whatever path was requested, so
  // relative URLs must resolve from the project root, not that path.
  if (/\.github\.io$/.test(location.hostname)) {
    var base = document.createElement("base");
    base.href = "/" + location.pathname.split("/")[1] + "/";
    document.head.appendChild(base);
  }
</script>
<link id="theme-link" rel="stylesheet" href="dist/blue-future.css">
<link rel="stylesheet" href="assets/css/demo.css">
<script src="assets/js/prefs.js"></script>
</head>
<!-- The themed not-found page (PLAN.md §14), also the GitHub Pages 404.
     .empty-state.is-404 in the app shell; the theme supplies the look. -->
<body class="app">
  <header class="app-bar demo-topbar">
    <span class="nav-brand">ftl-themes</span>
    <nav class="nav" aria-label="Demo pages">
      <a class="nav-item" href="dashboard.html" data-demo-link>Dashboard</a>
      <a class="nav-item" href="marketing.html" data-demo-link>Marketing</a>
      <a class="nav-item" href="ticketsystem.html" data-demo-link>Support</a>
      <a class="nav-item" href="powerstation.html" data-demo-link>Power</a>
      <a class="nav-item" href="soundmixer.html" data-demo-link>Mixer</a>
      <a class="nav-item" href="livechat.html" data-demo-link>Chat</a>
      <a class="nav-item" href="nesting.html" data-demo-link>Nesting</a>
    </nav>
    <div class="cluster push">
      <select class="select is-auto" id="theme-picker" aria-label="Theme"></select>
    </div>
  </header>

  <aside class="app-rail" aria-hidden="true"></aside>

  <main class="app-main">
    <div class="empty-state is-404">
      <svg class="icon empty-state-icon" aria-hidden="true"><use href="assets/icons/icons.svg#icon-map-question"/></svg>
      <h1 class="empty-state-title">Page not found</h1>
      <p class="empty-state-hint">There is nothing at this address. It may have moved, or the link may be mistyped.</p>
      <div class="cluster">
        <a class="btn btn-primary" href="index.html" data-demo-link>Go to the examples</a>
        <a class="btn" href="gallery.html" data-demo-link>Browse the themes</a>
      </div>
    </div>
  </main>

  <footer class="app-status">
    <span>Error 404</span>
  </footer>

<script src="assets/js/tint.js"></script>
<script src="assets/js/theme-loader.js"></script>
</body>
</html>
