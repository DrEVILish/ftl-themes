<!DOCTYPE html>
<html data-theme="blue-future">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ftl-themes demo</title>
<link id="ftl-theme-link" rel="stylesheet" href="dist/blue-future.css">
<style>
  /* Demo-page-only chrome, not part of the ftl-themes contract. */
  .demo-shell { max-width: 62rem; margin: 0 auto; padding: 1.5rem; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 0.75rem 0; }
  .demo-row-top { align-items: flex-start; }
  .demo-section { margin: 2rem 0; }
  .demo-bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-bottom: 1rem; }
  .demo-note { font-size: 0.8em; opacity: 0.7; }
  .w-14 { width: 14rem; } .w-16 { width: 16rem; } .w-10 { width: 10rem; }
</style>
</head>
<body>

<div class="ftl-lcars-chrome" id="chrome" hidden>
  <header class="ftl-lcars-chrome-header">
    <span class="ftl-lcars-chrome-brand">ftl-themes &bull; 47-alpha</span>
  </header>
  <div class="ftl-lcars-chrome-rail">
    <div class="ftl-lcars-chrome-rail-bar"></div>
    <div class="ftl-lcars-chrome-rail-bar"></div>
    <div class="ftl-lcars-chrome-rail-bar"></div>
    <div class="ftl-lcars-chrome-rail-bar"></div>
    <nav class="ftl-lcars-chrome-nav">
      <a class="ftl-nav-item is-active" href="#">Ops</a>
      <a class="ftl-nav-item" href="#">Sci</a>
      <a class="ftl-nav-item" href="#">Eng</a>
    </nav>
  </div>
  <main class="ftl-lcars-chrome-content" id="chrome-slot"></main>
</div>

<div id="plain">
  <div class="demo-shell" id="plain-slot"></div>
</div>

<!-- One copy of every component, moved between the plain and chrome-wrapped
     containers above so both layouts are exercised by the same markup. -->
<template id="components">
  <div class="demo-bar">
    <label>
      <span class="ftl-label" style="display:inline">Theme</span>
      <select class="ftl-select" id="theme-picker" style="display:inline-block;width:auto;"></select>
    </label>
    <label class="ftl-switch" title="LCARS chrome">
      <input type="checkbox" id="chrome-toggle">
      <span class="ftl-switch-track"><span class="ftl-switch-thumb"></span></span>
    </label>
    <span class="demo-note" id="chrome-note">LCARS chrome</span>
    <span class="demo-note" id="theme-desc"></span>
  </div>

  <nav class="ftl-nav">
    <span class="ftl-nav-brand">ftl-themes</span>
    <a class="ftl-nav-item is-active" href="#">Dashboard</a>
    <a class="ftl-nav-item" href="#">Settings</a>
    <a class="ftl-nav-item" href="#">Logs</a>
  </nav>

  <div class="ftl-tabs demo-section">
    <button class="ftl-tab is-active">Overview</button>
    <button class="ftl-tab">Library</button>
    <button class="ftl-tab">Advanced</button>
  </div>

  <div class="demo-section">
    <h2>Buttons</h2>
    <div class="demo-row">
      <button class="ftl-btn ftl-btn-primary">Primary</button>
      <button class="ftl-btn ftl-btn-secondary">Secondary</button>
      <button class="ftl-btn ftl-btn-danger">Delete</button>
      <button class="ftl-btn ftl-btn-success">Confirm</button>
      <button class="ftl-btn ftl-btn-ghost">Ghost</button>
      <button class="ftl-btn ftl-btn-primary" disabled>Disabled</button>
      <button class="ftl-btn ftl-btn-sm ftl-btn-primary">Small</button>
    </div>
    <div class="demo-row">
      <span class="demo-note">htmx pending state (.htmx-request):</span>
      <button class="ftl-btn ftl-btn-primary htmx-request">Saving<span class="ftl-indicator"></span></button>
      <span class="ftl-indicator htmx-request"></span>
    </div>
  </div>

  <div class="demo-section">
    <h2>Form controls</h2>
    <div class="demo-row demo-row-top">
      <div class="ftl-field w-14">
        <label class="ftl-label">Text input</label>
        <input class="ftl-input" type="text" placeholder="Placeholder">
        <span class="ftl-field-hint">A hint about this field.</span>
      </div>
      <div class="ftl-field w-10">
        <label class="ftl-label">Select</label>
        <select class="ftl-select"><option>Option A</option><option>Option B</option></select>
      </div>
      <div class="ftl-field w-14">
        <label class="ftl-label">Textarea</label>
        <textarea class="ftl-textarea"></textarea>
      </div>
    </div>
    <div class="demo-row">
      <label><input class="ftl-checkbox" type="checkbox" checked> Checkbox</label>
      <label class="ftl-switch">
        <input type="checkbox" checked>
        <span class="ftl-switch-track"><span class="ftl-switch-thumb"></span></span>
      </label>
      <input class="ftl-slider w-10" type="range" value="60">
    </div>
  </div>

  <div class="demo-section">
    <h2>Surfaces</h2>
    <div class="demo-row demo-row-top">
      <div class="ftl-panel w-14">
        <div class="ftl-panel-header">Panel header</div>
        <p>A generic card or pane.</p>
      </div>
      <div class="ftl-modal w-16">
        <div class="ftl-modal-header">Modal title</div>
        <p>Body content goes here.</p>
        <div class="ftl-modal-footer">
          <button class="ftl-btn ftl-btn-secondary ftl-btn-sm">Cancel</button>
          <button class="ftl-btn ftl-btn-primary ftl-btn-sm">Save</button>
        </div>
      </div>
      <div class="ftl-dropdown w-10">
        <a class="ftl-dropdown-item" href="#">Item one</a>
        <a class="ftl-dropdown-item" href="#">Item two</a>
      </div>
    </div>
    <div class="ftl-toolbar demo-section">
      <button class="ftl-btn ftl-btn-sm ftl-btn-ghost">Add</button>
      <button class="ftl-btn ftl-btn-sm ftl-btn-ghost">Import</button>
      <span class="ftl-badge ftl-badge-accent">4 queued</span>
    </div>
  </div>

  <div class="demo-section">
    <h2>Table</h2>
    <table class="ftl-table">
      <thead><tr><th>Name</th><th>Status</th><th>Elapsed</th><th>Progress</th></tr></thead>
      <tbody>
        <tr class="is-active"><td>Track 01</td><td><span class="ftl-status ftl-status-ok">Connected</span></td><td class="ftl-mono">00:12:04</td><td><div class="ftl-progress"><div class="ftl-progress-bar" style="width:80%"></div></div></td></tr>
        <tr class="is-selected"><td>Track 02</td><td><span class="ftl-status ftl-status-warn">Pending</span></td><td class="ftl-mono">00:03:51</td><td><div class="ftl-progress"><div class="ftl-progress-bar" style="width:35%"></div></div></td></tr>
        <tr><td>Track 03</td><td><span class="ftl-status ftl-status-error">Disconnected</span></td><td class="ftl-mono">00:00:00</td><td><div class="ftl-progress"><div class="ftl-progress-bar" style="width:0%"></div></div></td></tr>
        <tr><td>Track 04</td><td><span class="ftl-status ftl-status-idle">Idle</span></td><td class="ftl-mono">00:41:17</td><td><div class="ftl-progress"><div class="ftl-progress-bar" style="width:10%"></div></div></td></tr>
      </tbody>
    </table>
  </div>

  <div class="demo-section">
    <h2>Badges</h2>
    <div class="demo-row">
      <span class="ftl-badge">Default</span>
      <span class="ftl-badge ftl-badge-accent">Accent</span>
      <span class="ftl-badge ftl-badge-danger">Danger</span>
      <span class="ftl-badge ftl-badge-success">Success</span>
    </div>
  </div>
</template>

<script>
  var link = document.getElementById("ftl-theme-link");
  var chromeEl = document.getElementById("chrome");
  var plainEl = document.getElementById("plain");
  var params = new URLSearchParams(location.search);
  var themes = [];

  // Mount the single component template into whichever container is active.
  document.getElementById("plain-slot").appendChild(
    document.getElementById("components").content);

  var picker = document.getElementById("theme-picker");
  var desc = document.getElementById("theme-desc");
  var chromeToggle = document.getElementById("chrome-toggle");
  var chromeNote = document.getElementById("chrome-note");

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function applyTheme(slug) {
    document.documentElement.dataset.theme = slug;
    link.href = "dist/" + slug + ".css";
    store("ftl-demo-theme", slug);
    var t = themes.find(function (x) { return x.slug === slug; });
    desc.textContent = t ? t.description : "";
    var supported = !!(t && t.hasChrome);
    chromeToggle.disabled = !supported;
    chromeNote.textContent = supported ? "LCARS chrome" : "chrome (this theme has none)";
    if (!supported && chromeToggle.checked) { chromeToggle.checked = false; setChrome(false); }
  }

  function setChrome(on) {
    var slot = on ? document.getElementById("chrome-slot") : document.getElementById("plain-slot");
    // Move the live nodes rather than re-rendering, so control state survives.
    var from = on ? document.getElementById("plain-slot") : document.getElementById("chrome-slot");
    while (from.firstChild) slot.appendChild(from.firstChild);
    chromeEl.hidden = !on;
    plainEl.hidden = on;
    store("ftl-demo-chrome", on ? "1" : "0");
  }

  fetch("dist/themes.json")
    .then(function (r) { return r.json(); })
    .then(function (list) {
      themes = list;
      list.forEach(function (t) {
        var o = document.createElement("option");
        o.value = t.slug;
        o.textContent = t.label;
        picker.appendChild(o);
      });
      var initial = params.get("theme") || read("ftl-demo-theme") || "blue-future";
      if (!list.some(function (t) { return t.slug === initial; })) initial = list[0].slug;
      picker.value = initial;
      applyTheme(initial);
      if (params.get("chrome") === "1" || read("ftl-demo-chrome") === "1") {
        chromeToggle.checked = true;
        setChrome(true);
      }
    })
    .catch(function () {
      // file:// without fetch access — fall back so the page still works.
      desc.textContent = "themes.json unavailable (serve the folder over HTTP for the theme list)";
      ["blue-future", "cue-lab", "lcars"].forEach(function (s) {
        var o = document.createElement("option"); o.value = o.textContent = s; picker.appendChild(o);
      });
      applyTheme(params.get("theme") || "blue-future");
    });

  picker.addEventListener("change", function () { applyTheme(picker.value); });
  chromeToggle.addEventListener("change", function () { setChrome(chromeToggle.checked); });
</script>
</body>
</html>
