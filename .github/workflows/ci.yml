name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bundles and manifest
        run: scripts/build.sh
      - name: Test the CSS reader the build and lint share
        run: python3 scripts/test_cssparse.py
      - name: Lint themes against the contract
        run: scripts/check.sh
