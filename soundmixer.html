<!DOCTYPE html>
<html data-theme="aqua">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Mixer — ftl-themes layout demo</title>
<link id="theme-link" rel="stylesheet" href="dist/aqua.css">
<style>
  * { box-sizing: border-box; }
  .demo-topbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .demo-topbar-spacer { flex: 1; }
  .demo-topbar .nav-brand { white-space: nowrap; }
  .demo-strips { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 0.75rem; }
  .demo-strip { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding-bottom: 0.9rem; }
  .demo-strip-body { display: flex; align-items: stretch; justify-content: center; gap: 0.75rem; height: 10rem; }
</style>
</head>
<body class="app">
  <header class="app-bar">
    <nav class="nav demo-topbar">
      <span class="nav-brand">Console 6</span>
      <a class="nav-item is-active" href="#">Mixer</a>
      <a class="nav-item" href="#">Routing</a>
      <a class="nav-item" href="#">Scenes</a>
      <a class="nav-item" href="#">Meters</a>
      <span class="demo-topbar-spacer"></span>
      <select class="select" id="theme-picker" aria-label="Theme" style="width:auto; flex:none;"></select>
    </nav>
  </header>

  <aside class="app-rail" aria-hidden="true"></aside>

  <main class="app-main">
    <h1>Front of house</h1>
    <div class="transport" style="margin: 0.5rem 0 1rem;">
      <button class="btn btn-go">Play</button>
      <button class="btn">Stop</button>
      <label class="toggle-btn is-danger"><input type="checkbox"><span class="toggle-btn-off">Rec</span><span class="toggle-btn-on">Recording</span></label>
      <span class="readout readout-lg">01:24:07<span class="readout-unit">tc</span></span>
      <span class="readout">48<span class="readout-unit">kHz</span></span>
      <span class="lamp is-on" title="clock locked"></span>
      <span class="lamp is-error" title="clip"></span>
    </div>
    <div class="demo-strips">
      <section class="panel demo-strip">
        <header class="panel-header"><strong>Kick</strong></header>
        <div class="demo-strip-body">
          <div class="meter meter-v" style="--meter-level:62%;--meter-peak:71%"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <input class="slider is-vertical" type="range" min="-60" max="12" step="1" value="-6" aria-label="Kick level (dB)">
        </div>
        <span class="readout readout-sm">-6<span class="readout-unit">dB</span></span>
        <div class="stack" style="width:100%">
          <label class="toggle-btn is-danger"><input type="checkbox"><span class="toggle-btn-off">Mute</span><span class="toggle-btn-on">Muted</span></label>
          <label class="toggle-btn"><input type="checkbox"><span class="toggle-btn-off">Solo</span><span class="toggle-btn-on">Solo</span></label>
        </div>
      </section>
      <section class="panel demo-strip">
        <header class="panel-header"><strong>Snare</strong></header>
        <div class="demo-strip-body">
          <div class="meter meter-v" style="--meter-level:55%;--meter-peak:80%"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <input class="slider is-vertical" type="range" min="-60" max="12" step="1" value="-9" aria-label="Snare level (dB)">
        </div>
        <span class="readout readout-sm">-9<span class="readout-unit">dB</span></span>
        <div class="stack" style="width:100%">
          <label class="toggle-btn is-danger"><input type="checkbox"><span class="toggle-btn-off">Mute</span><span class="toggle-btn-on">Muted</span></label>
          <label class="toggle-btn"><input type="checkbox"><span class="toggle-btn-off">Solo</span><span class="toggle-btn-on">Solo</span></label>
        </div>
      </section>
      <section class="panel demo-strip">
        <header class="panel-header"><strong>Bass</strong></header>
        <div class="demo-strip-body">
          <div class="meter meter-v" style="--meter-level:70%;--meter-peak:74%"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <input class="slider is-vertical" type="range" min="-60" max="12" step="1" value="-4" aria-label="Bass level (dB)">
        </div>
        <span class="readout readout-sm">-4<span class="readout-unit">dB</span></span>
        <div class="stack" style="width:100%">
          <label class="toggle-btn is-danger"><input type="checkbox"><span class="toggle-btn-off">Mute</span><span class="toggle-btn-on">Muted</span></label>
          <label class="toggle-btn"><input type="checkbox"><span class="toggle-btn-off">Solo</span><span class="toggle-btn-on">Solo</span></label>
        </div>
      </section>
      <section class="panel demo-strip">
        <header class="panel-header"><strong>Keys</strong></header>
        <div class="demo-strip-body">
          <div class="meter meter-v" style="--meter-level:40%;--meter-peak:52%"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <input class="slider is-vertical" type="range" min="-60" max="12" step="1" value="-12" aria-label="Keys level (dB)">
        </div>
        <span class="readout readout-sm">-12<span class="readout-unit">dB</span></span>
        <div class="stack" style="width:100%">
          <label class="toggle-btn is-danger"><input type="checkbox" checked><span class="toggle-btn-off">Mute</span><span class="toggle-btn-on">Muted</span></label>
          <label class="toggle-btn"><input type="checkbox"><span class="toggle-btn-off">Solo</span><span class="toggle-btn-on">Solo</span></label>
        </div>
      </section>
      <section class="panel demo-strip">
        <header class="panel-header"><strong>Vocal</strong></header>
        <div class="demo-strip-body">
          <div class="meter meter-v" style="--meter-level:78%;--meter-peak:90%"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <input class="slider is-vertical" type="range" min="-60" max="12" step="1" value="-3" aria-label="Vocal level (dB)">
        </div>
        <span class="readout readout-sm">-3<span class="readout-unit">dB</span></span>
        <div class="stack" style="width:100%">
          <label class="toggle-btn is-danger"><input type="checkbox"><span class="toggle-btn-off">Mute</span><span class="toggle-btn-on">Muted</span></label>
          <label class="toggle-btn"><input type="checkbox" checked><span class="toggle-btn-off">Solo</span><span class="toggle-btn-on">Solo</span></label>
        </div>
      </section>
      <section class="panel demo-strip">
        <header class="panel-header"><strong>Master</strong></header>
        <div class="demo-strip-body">
          <div class="meter meter-v" style="--meter-level:68%;--meter-peak:76%"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <input class="slider is-vertical" type="range" min="-60" max="12" step="1" value="-2" aria-label="Master level (dB)">
        </div>
        <span class="readout readout-sm">-2<span class="readout-unit">dB</span></span>
        <div class="stack" style="width:100%">
          <label class="toggle-btn is-danger"><input type="checkbox"><span class="toggle-btn-off">Mute</span><span class="toggle-btn-on">Muted</span></label>
          <label class="toggle-btn"><input type="checkbox"><span class="toggle-btn-off">Solo</span><span class="toggle-btn-on">Solo</span></label>
        </div>
      </section>
    </div>
  </main>

  <footer class="app-status">
    <span>Console 6</span>
    <span class="status status-ok">Clock locked</span>
  </footer>

<script src="assets/js/theme-loader.js"></script>
</body>
</html>
