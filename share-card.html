<!DOCTYPE html>
<html lang="en" data-theme="blue-future">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Share card — ftl-themes</title>
<link id="theme-link" rel="stylesheet" href="dist/blue-future.css">
<!-- Open Graph share image template (PLAN.md §23): a 1200×630 card in the
     current theme. Render it headless and screenshot the .share-card box:
       share-card.html?theme=<slug>&title=…&subtitle=…&site=…&tag=…
     Every value lands via textContent. The card is core components only
     (.app-bar, .panel, .badge); the few rules below only fix its size. -->
<style>
  html, body { margin: 0; }
  body { background: var(--bg); }
  .share-card { box-sizing: border-box; inline-size: 1200px; block-size: 630px; display: grid;
    grid-template-rows: auto 1fr; overflow: hidden; background: var(--bg); }
  .share-card > * { grid-area: auto; }
  .share-card > .app-bar { font-size: 24px; }
  .share-card .panel { margin: 48px 56px; display: grid; align-content: center; gap: 28px; padding: 56px; }
  .share-title { margin: 0; font-size: 72px; line-height: 1.05; overflow-wrap: break-word; }
  .share-subtitle { margin: 0; font-size: 32px; line-height: 1.3; color: var(--muted); }
</style>
</head>
<body>
  <div class="share-card">
    <header class="app-bar"><span class="nav-brand" id="share-site">ftl-themes</span><span class="badge push" id="share-tag">v5</span></header>
    <section class="panel">
      <h1 class="share-title" id="share-title">45 switchable themes, one markup</h1>
      <p class="share-subtitle" id="share-subtitle">From LCARS to Windows 95: drop in a stylesheet, keep your HTML.</p>
    </section>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      [["title", "share-title"], ["subtitle", "share-subtitle"], ["site", "share-site"], ["tag", "share-tag"]].forEach(function (p) {
        var v = q.get(p[0]);
        if (v !== null) document.getElementById(p[1]).textContent = v.slice(0, 160);
      });
    })();
  </script>
  <script src="assets/js/theme-loader.js"></script>
</body>
</html>
