<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Alienware: angular clip-path-cut-corner chassis geometry, redrawn as
       actual polygon paths (a <symbol> can't use CSS clip-path). Circles
       and rounded rects from the generic set become cut-corner octagons/
       hexagons; every remaining curve is straightened into a diagonal
       chamfer. Square caps + miter joins throughout stand in for the
       theme's thin cyan-glow line weight — color/weight still come from
       the ftl-icon-fill / ftl-icon-stroke-width tokens, nothing is hardcoded here.
       Ids not listed here fall back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <path d="M4 11 12 5l8 6"/>
        <path d="M6 11v9h12v-9"/>
        <path d="M10 20v-5h4v5"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/>
        <path d="M10 10h4v4h-4z"/>
      </g>
    </symbol>
