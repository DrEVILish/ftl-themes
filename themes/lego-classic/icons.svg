<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- LEGO Classic: thick, uniform 3px stroke, round caps/joins, flat and
       chunky like a moulded brick outline. Mostly stroke-only (fill: none)
       so the shape reads as an outlined toy piece rather than a naturalistic
       icon. A couple of icons (grid, trash) pick up a small filled circular
       "stud" accent where a brick's nub logically belongs. Ids not listed
       here fall back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5 12 5l8 6.5"/>
        <path d="M6 11v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8"/>
        <path d="M10 20v-5h4v5"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="6.5"/>
