<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- XBMC: flat rectangular/geometric tiles for a remote-driven home-theatre
       shell — thin uniform strokes, square linecaps/miter joins (no soft
       rounded corners), and large clear shapes readable from a couch. A
       handful of nav/media icons (home, calendar, folder, user, bell, star,
       play) carry a short solid accent bar under the glyph, echoing the
       theme's signature glowing-underline active-nav treatment in
       .ftl-nav-item.is-active::after. Ids not listed here fall back to the
       generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M4 11.5 12 4l8 7.5"/>
      <rect x="6" y="11.5" width="12" height="8.5"/>
      <rect x="10" y="14.5" width="4" height="5.5"/>
      <rect x="6" y="21.4" width="12" height="1" fill="currentColor" stroke="none"/>
    </symbol>
