<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Bloomberg: blocky, character-cell glyphs — plain right-angle boxes
       (no rounding, no diagonal corner chamfers), pixel-staircase curves
       standing in for anything the generic set drew as an arc (roofs,
       shoulders, tapers), and zero true curves (no <circle>/arc commands)
       anywhere in the set. Square caps + miter joins throughout. Weight is
       intentionally NOT hardcoded per-symbol: the theme already sets the
       ftl-icon-stroke-width token to 1.4 globally (its wireframe-at-
       extreme-density look), so these inherit that instead of overriding
       it. Ids not listed here fall back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <path d="M4 12V10H6V8H8V6H10V4H14V6H16V8H18V10H20V12"/>
        <path d="M6 12v9h12v-9"/>
        <path d="M10 21v-5h4v5"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <rect x="6" y="6" width="12" height="12"/>
        <rect x="10" y="10" width="4" height="4"/>
        <path d="M12 2v4"/>
        <path d="M12 18v4"/>
        <path d="M2 12h4"/>
        <path d="M18 12h4"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
