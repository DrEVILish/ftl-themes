      <path d="M12 10v4"/>
      <path d="M12 17h.01"/>
      <path d="M9.5 8a4 4 0 0 1 2.5-1.2" stroke-width="3"/>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
