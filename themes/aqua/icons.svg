      <path d="M4 17.5h16"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
