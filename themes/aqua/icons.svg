<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Aqua: pillowy Snow Leopard candy-UI silhouettes — generous corner
       radii everywhere plus a bolder inner "gloss" arc riding the top of
       each rounded shape, echoing the traffic-light button highlight. The
       thin outer contour stays at the inherited stroke-width; only the
       gloss accent sets its own (heavier) stroke-width explicitly. Caps
       stay the inherited round default — no square/miter overrides. Color
       and base weight still come entirely from the ftl-icon-fill /
       ftl-icon-stroke-width tokens. Ids not listed here fall back to the
       generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="M3 11.5 12 4l9 7.5"/>
      <path d="M5.5 10.5v8a1.5 1.5 0 0 0 1.5 1.5H9a1 1 0 0 0 1-1v-3a2 2 0 0 1 4 0v3a1 1 0 0 0 1 1h2a1.5 1.5 0 0 0 1.5-1.5v-8"/>
      <path d="M8 8.2a6 6 0 0 1 5-3" stroke-width="3"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"/>
      <circle cx="12" cy="12" r="3"/>
      <path d="M8.5 8a5 5 0 0 1 3-1.7" stroke-width="3"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m21 21-4.3-4.3"/>
      <path d="M7 8.5a5 5 0 0 1 4-2" stroke-width="3"/>
    </symbol>
