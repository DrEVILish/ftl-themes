    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z" stroke-linejoin="round"/></symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24">
