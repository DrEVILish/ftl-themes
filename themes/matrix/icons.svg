        <path d="M7 9c0-3 2-5 5-5s5 2 5 5c0 4 1.5 5 1.5 5h-13S7 13 7 9z"/>
        <path d="M10 17a2 2 0 0 0 4 0"/>
      </g>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 4v16M4 12h16" stroke-width="1" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24">
      <path d="M4 12h16" stroke-width="1" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M4 13l5 5 11-11" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
