    <symbol id="icon-list" viewBox="0 0 24 24">
      <g stroke-width="1" stroke-linecap="square">
        <path d="M8 6h13"/>
        <path d="M8 12h13"/>
        <path d="M8 18h13"/>
        <path d="M3 6h.01"/>
        <path d="M3 12h.01"/>
        <path d="M3 18h.01"/>
