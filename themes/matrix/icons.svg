<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- The Matrix: thin, monospace/glyph-like line marks — a 1px stroke
       and square terminal caps stand in for the phosphor terminal's
       hairline character strokes, distinct from the generic set's 2px
       rounded default. Shapes are kept close to the generic silhouettes
       so they still read at a glance; the weight and cap style carry the
       theming. Ids not listed here fall back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g stroke-width="1" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M4 12 12 5l8 7"/>
        <path d="M6 12v8h12v-8"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M12 3v18M3 12h18M6 6l12 12M18 6 6 18" stroke-width="1" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g stroke-width="1" stroke-linecap="square">
        <circle cx="10" cy="10" r="6"/>
        <path d="M15 15 21 21"/>
      </g>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6 18 18M18 6 6 18" stroke-width="1" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <g stroke-width="1" stroke-linecap="square">
        <circle cx="12" cy="8" r="3"/>
