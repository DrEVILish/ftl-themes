<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Windows 95: chunky, low-detail pixel-art icons. Hard corners and
       square caps/joins are set per-shape (overriding core's rounded
       .ftl-icon default) so nothing here reads as smoothed; a theme this
       thick-stroked (ftl-icon-stroke-width: 2.6) needs hard corners to
       avoid looking like blobs. Only a subset of icon ids is defined —
       every id not listed here still falls back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <polyline points="3,11 12,4 21,11" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="5" y="11" width="14" height="9" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="10" y="14" width="4" height="6" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <rect x="10" y="2" width="4" height="5" stroke-linejoin="miter"/>
      <rect x="10" y="17" width="4" height="5" stroke-linejoin="miter"/>
      <rect x="2" y="10" width="5" height="4" stroke-linejoin="miter"/>
      <rect x="17" y="10" width="5" height="4" stroke-linejoin="miter"/>
      <rect x="7" y="7" width="10" height="10" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <rect x="3" y="3" width="12" height="12" stroke-linejoin="miter"/>
      <path d="M15 15 21 21" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M5 5 19 19" stroke-linecap="square"/>
      <path d="M19 5 5 19" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <rect x="8" y="3" width="8" height="8" stroke-linejoin="miter"/>
      <polygon points="4,21 4,19 8,14 16,14 20,19 20,21" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <polygon points="7,9 7,6 9,4 15,4 17,6 17,9 19,15 5,15" stroke-linejoin="miter"/>
      <rect x="10" y="17" width="4" height="2" stroke-linejoin="miter"/>
    </symbol>
    <!-- v3.14.0 additions: extending the chunky pixel-art convention past
         the original 6 icons (menu, check, warning, info, chevrons,
         transport controls, file/data chrome, hardware/media glyphs). -->
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="3" stroke-linejoin="miter"/>
      <rect x="3" y="10.5" width="18" height="3" stroke-linejoin="miter"/>
      <rect x="3" y="16" width="18" height="3" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4 13 9 18 20 5" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
      <polygon points="12,2 22,20 2,20" stroke-linejoin="miter"/>
      <rect x="11" y="9" width="2" height="6" stroke-linejoin="miter"/>
      <rect x="11" y="17" width="2" height="2" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" stroke-linejoin="miter"/>
      <rect x="11" y="10" width="2" height="7" stroke-linejoin="miter"/>
      <rect x="11" y="6" width="2" height="2" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><polyline points="5,9 12,16 19,9" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-chevron-up" viewBox="0 0 24 24"><polyline points="5,15 12,8 19,15" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><polyline points="9,5 16,12 9,19" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><polygon points="6,4 6,20 20,12" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" stroke-linejoin="miter"/><rect x="14" y="4" width="4" height="16" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <polyline points="3,9 3,3 9,3" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M3 3 11 11" stroke-linecap="square"/>
      <polyline points="21,15 21,21 15,21" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M21 21 13 13" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 3 12 15" stroke-linecap="square"/>
      <polyline points="6,10 12,16 18,10" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="4" y="19" width="16" height="2" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 21 12 9" stroke-linecap="square"/>
      <polyline points="6,14 12,8 18,14" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="4" y="3" width="16" height="2" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <rect x="6" y="8" width="12" height="12" stroke-linejoin="miter"/>
      <rect x="9" y="4" width="6" height="3" stroke-linejoin="miter"/>
      <rect x="4" y="7" width="16" height="2" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <polygon points="4,20 4,16 15,5 19,9 8,20" stroke-linejoin="miter"/>
      <rect x="13.5" y="3.5" width="5.5" height="5.5" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><rect x="10" y="4" width="4" height="16" stroke-linejoin="miter"/><rect x="4" y="10" width="16" height="4" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="4" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M4 12h12" stroke-linecap="square"/><polyline points="12,6 18,12 12,18" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M20 12H8" stroke-linecap="square"/><polyline points="12,6 6,12 12,18" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M12 20V8" stroke-linecap="square"/><polyline points="6,12 12,6 18,12" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 24 24"><path d="M12 4v12" stroke-linecap="square"/><polyline points="6,12 12,18 18,12" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><polygon points="3,7 9,7 11,9 21,9 21,19 3,19" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><polygon points="6,3 14,3 18,7 18,21 6,21" stroke-linejoin="miter"/><rect x="14" y="3" width="4" height="4" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" stroke-linejoin="miter"/>
      <rect x="3" y="9" width="18" height="2" stroke-linejoin="miter"/>
      <rect x="7" y="2" width="2" height="4" stroke-linejoin="miter"/>
      <rect x="15" y="2" width="2" height="4" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" stroke-linejoin="miter"/><path d="M12 7v5h4" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" stroke-linejoin="miter"/><polyline points="3,7 12,13 21,7" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" stroke-linejoin="miter"/><path d="M8 11V7h8v4" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-unlock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" stroke-linejoin="miter"/><path d="M8 11V7h7" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><polygon points="4,9 8,9 13,5 13,19 8,15 4,15" stroke-linejoin="miter"/><polyline points="17,8 20,12 17,16" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-volume-mute" viewBox="0 0 24 24"><polygon points="4,9 8,9 13,5 13,19 8,15 4,15" stroke-linejoin="miter"/><path d="M17 9 22 15" stroke-linecap="square"/><path d="M22 9 17 15" stroke-linecap="square"/></symbol>
    <symbol id="icon-music-note" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13" stroke-linecap="square" stroke-linejoin="miter"/><rect x="4" y="16" width="5" height="5" stroke-linejoin="miter"/><rect x="14" y="14" width="5" height="5" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" stroke-linejoin="miter"/><polygon points="16,9 22,7 22,17 16,15" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-headphones" viewBox="0 0 24 24"><path d="M4 14V9h3V5h10v4h3v5" stroke-linecap="square" stroke-linejoin="miter"/><rect x="2" y="14" width="5" height="7" stroke-linejoin="miter"/><rect x="17" y="14" width="5" height="7" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-skip-forward" viewBox="0 0 24 24"><polygon points="5,4 5,20 16,12" stroke-linejoin="miter"/><rect x="17" y="4" width="2" height="16" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-skip-back" viewBox="0 0 24 24"><polygon points="19,4 19,20 8,12" stroke-linejoin="miter"/><rect x="5" y="4" width="2" height="16" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="M4 4 20 20" stroke-linecap="square"/><path d="M4 20 20 4" stroke-linecap="square"/><polyline points="15,3 20,3 20,8" stroke-linecap="square" stroke-linejoin="miter"/><polyline points="15,21 20,21 20,16" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="M3 8h14" stroke-linecap="square"/><polyline points="13,3 17,8 13,13" stroke-linecap="square" stroke-linejoin="miter"/><path d="M21 16H7" stroke-linecap="square"/><polyline points="11,21 7,16 11,11" stroke-linecap="square" stroke-linejoin="miter"/></symbol>
    <symbol id="icon-album" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" stroke-linejoin="miter"/><rect x="10" y="10" width="4" height="4" stroke-linejoin="miter"/></symbol>
  </defs>
</svg>
