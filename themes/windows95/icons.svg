<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Windows 95: chunky, low-detail pixel-art icons. Hard corners and
       square caps/joins are set per-shape (overriding core's rounded
       .ftl-icon default) so nothing here reads as smoothed; a theme this
       thick-stroked (ftl-icon-stroke-width: 2.6) needs hard corners to
       avoid looking like blobs. Only a subset of icon ids is defined —
       every id not listed here still falls back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <polyline points="3,11 12,4 21,11" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="5" y="11" width="14" height="9" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="10" y="14" width="4" height="6" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <rect x="10" y="2" width="4" height="5" stroke-linejoin="miter"/>
      <rect x="10" y="17" width="4" height="5" stroke-linejoin="miter"/>
      <rect x="2" y="10" width="5" height="4" stroke-linejoin="miter"/>
      <rect x="17" y="10" width="5" height="4" stroke-linejoin="miter"/>
      <rect x="7" y="7" width="10" height="10" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <rect x="3" y="3" width="12" height="12" stroke-linejoin="miter"/>
      <path d="M15 15 21 21" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M5 5 19 19" stroke-linecap="square"/>
      <path d="M19 5 5 19" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <rect x="8" y="3" width="8" height="8" stroke-linejoin="miter"/>
      <polygon points="4,21 4,19 8,14 16,14 20,19 20,21" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <polygon points="7,9 7,6 9,4 15,4 17,6 17,9 19,15 5,15" stroke-linejoin="miter"/>
      <rect x="10" y="17" width="4" height="2" stroke-linejoin="miter"/>
    </symbol>
  </defs>
</svg>
