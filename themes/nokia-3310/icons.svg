<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Nokia 3310: coarse, low-resolution monochrome LCD segment shapes —
       big flat currentColor blocks, no anti-aliasing, minimal detail,
       like a real feature-phone menu glyph. Ids not listed here fall
       back to the generic outline sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <polygon points="3,12 12,4 21,12 21,20 15,20 15,14 9,14 9,20 3,20" fill="currentColor"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="9" y="2" width="6" height="6"/>
        <rect x="2" y="9" width="20" height="6"/>
        <rect x="9" y="16" width="6" height="6"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <polygon points="7,2 13,2 16,5 16,11 13,14 7,14 4,11 4,5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter"/>
      <rect x="9.5" y="16.5" width="9" height="4" fill="currentColor" transform="rotate(45 14 18.5)"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="2" y="2" width="6" height="6"/>
        <rect x="16" y="2" width="6" height="6"/>
        <rect x="9" y="9" width="6" height="6"/>
        <rect x="2" y="16" width="6" height="6"/>
        <rect x="16" y="16" width="6" height="6"/>
      </g>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <rect x="8" y="2" width="8" height="8" fill="currentColor"/>
      <polygon points="3,22 3,18 8,12 16,12 21,18 21,22" fill="currentColor"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <polygon points="8,2 16,2 19,8 19,14 5,14 5,8" fill="currentColor"/>
      <rect x="9" y="16" width="6" height="4" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
