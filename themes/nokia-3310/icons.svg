<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Nokia 3310: coarse, low-resolution monochrome LCD segment shapes —
       big flat currentColor blocks, no anti-aliasing, minimal detail,
       like a real feature-phone menu glyph. Ids not listed here fall
       back to the generic outline sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <polygon points="3,12 12,4 21,12 21,20 15,20 15,14 9,14 9,20 3,20" fill="currentColor"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="9" y="2" width="6" height="6"/>
        <rect x="2" y="9" width="20" height="6"/>
        <rect x="9" y="16" width="6" height="6"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <polygon points="7,2 13,2 16,5 16,11 13,14 7,14 4,11 4,5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter"/>
      <rect x="9.5" y="16.5" width="9" height="4" fill="currentColor" transform="rotate(45 14 18.5)"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="2" y="2" width="6" height="6"/>
        <rect x="16" y="2" width="6" height="6"/>
        <rect x="9" y="9" width="6" height="6"/>
        <rect x="2" y="16" width="6" height="6"/>
        <rect x="16" y="16" width="6" height="6"/>
      </g>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <rect x="8" y="2" width="8" height="8" fill="currentColor"/>
      <polygon points="3,22 3,18 8,12 16,12 21,18 21,22" fill="currentColor"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <polygon points="8,2 16,2 19,8 19,14 5,14 5,8" fill="currentColor"/>
      <rect x="9" y="16" width="6" height="4" fill="currentColor"/>
    </symbol>
    <!-- Extension batch: more LCD-segment glyphs, same coarse blocky
         convention (flat currentColor fills, square strokes when a line
         is needed, no anti-aliased curves). -->
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="2" y="3" width="20" height="5"/>
        <rect x="2" y="10" width="20" height="4"/>
        <rect x="2" y="16" width="20" height="5"/>
      </g>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <polyline points="3,13 9,19 21,4" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="10" y="2" width="4" height="20"/>
        <rect x="2" y="10" width="20" height="4"/>
      </g>
    </symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24">
      <rect x="2" y="10" width="20" height="4" fill="currentColor"/>
    </symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="9" y="10" width="13" height="4"/>
        <polygon points="2,12 11,4 11,20"/>
      </g>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="2" y="10" width="13" height="4"/>
        <polygon points="22,12 13,4 13,20"/>
      </g>
    </symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="10" y="9" width="4" height="13"/>
        <polygon points="12,2 4,11 20,11"/>
      </g>
    </symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="10" y="2" width="4" height="13"/>
        <polygon points="12,22 4,13 20,13"/>
      </g>
    </symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <polyline points="16,3 7,12 16,21" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <polyline points="8,3 17,12 8,21" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-chevron-up" viewBox="0 0 24 24">
      <polyline points="3,16 12,7 21,16" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <polyline points="3,8 12,17 21,8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <polygon points="6,3 6,21 20,12" fill="currentColor"/>
    </symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="6" y="3" width="5" height="18"/>
        <rect x="13" y="3" width="5" height="18"/>
      </g>
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" fill="currentColor"/>
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="2" y="5" width="20" height="14" fill="none" stroke="currentColor" stroke-width="3"/>
      <polygon points="2,5 12,13 22,5" fill="currentColor"/>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="3" y="5" width="18" height="5" fill="currentColor"/>
      <g fill="currentColor">
        <rect x="7" y="2" width="3" height="5"/>
        <rect x="14" y="2" width="3" height="5"/>
      </g>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3"/>
      <g fill="currentColor">
        <rect x="11" y="6" width="3" height="7"/>
        <rect x="11" y="11" width="7" height="3"/>
      </g>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <polygon points="2,6 9,6 11,8 22,8 22,19 2,19" fill="currentColor"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" fill="none" stroke="currentColor" stroke-width="3"/>
      <polygon points="14,2 19,7 14,7" fill="currentColor"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="9" y="2" width="6" height="3"/>
        <rect x="2" y="5" width="20" height="3"/>
        <rect x="4" y="8" width="16" height="13"/>
      </g>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <g fill="currentColor">
        <polygon points="3,17 3,21 7,21 19,9 15,5"/>
        <rect x="15.5" y="1.5" width="6" height="6" transform="rotate(45 18.5 4.5)"/>
      </g>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="10" y="2" width="4" height="12"/>
        <polygon points="4,12 20,12 12,20"/>
        <rect x="3" y="21" width="18" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <g fill="currentColor">
        <polygon points="4,10 20,10 12,2"/>
        <rect x="10" y="10" width="4" height="10"/>
        <rect x="3" y="21" width="18" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" fill="currentColor"/>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <rect x="4" y="11" width="16" height="11" fill="currentColor"/>
      <rect x="7" y="4" width="10" height="9" fill="none" stroke="currentColor" stroke-width="3"/>
    </symbol>
    <symbol id="icon-unlock" viewBox="0 0 24 24">
      <rect x="4" y="11" width="16" height="11" fill="currentColor"/>
      <rect x="4" y="2" width="10" height="9" fill="none" stroke="currentColor" stroke-width="3"/>
    </symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24">
      <polygon points="4,3 9,3 11,8 8,10 14,16 16,13 21,15 21,20 18,21 4,7" fill="currentColor"/>
    </symbol>
    <symbol id="icon-wifi" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="10" y="18" width="4" height="4"/>
        <rect x="6" y="12" width="12" height="4"/>
        <rect x="2" y="6" width="20" height="4"/>
      </g>
    </symbol>
    <symbol id="icon-battery" viewBox="0 0 24 24">
      <rect x="2" y="7" width="18" height="10" fill="none" stroke="currentColor" stroke-width="3"/>
      <g fill="currentColor">
        <rect x="20" y="10" width="3" height="4"/>
        <rect x="5" y="10" width="10" height="4"/>
      </g>
    </symbol>
    <symbol id="icon-power" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="10" y="2" width="4" height="9"/>
        <rect x="4" y="6" width="4" height="4"/>
        <rect x="2" y="10" width="4" height="6"/>
        <rect x="4" y="16" width="4" height="4"/>
        <rect x="8" y="19" width="8" height="4"/>
        <rect x="16" y="16" width="4" height="4"/>
        <rect x="18" y="10" width="4" height="6"/>
        <rect x="16" y="6" width="4" height="4"/>
      </g>
    </symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24">
      <g fill="currentColor">
        <polygon points="3,9 9,9 15,4 15,20 9,15 3,15"/>
        <rect x="18" y="9" width="3" height="6"/>
      </g>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3"/>
      <g fill="currentColor">
        <rect x="11" y="5" width="3" height="3"/>
        <rect x="11" y="10" width="3" height="8"/>
      </g>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
      <polygon points="12,2 22,21 2,21" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter"/>
      <g fill="currentColor">
        <rect x="10.5" y="9" width="3" height="6"/>
        <rect x="10.5" y="17" width="3" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-help-circle" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3"/>
      <g fill="currentColor">
        <rect x="9" y="7" width="8" height="3"/>
        <rect x="14" y="10" width="3" height="4"/>
        <rect x="10" y="14" width="4" height="3"/>
        <rect x="10" y="18" width="4" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24">
      <rect x="3" y="3" width="10" height="18" fill="none" stroke="currentColor" stroke-width="3"/>
      <g fill="currentColor">
        <rect x="13" y="10" width="8" height="4"/>
        <polygon points="17,6 24,12 17,18"/>
      </g>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="4" y="4" width="16" height="4"/>
        <rect x="4" y="4" width="4" height="10"/>
        <rect x="4" y="16" width="16" height="4"/>
        <rect x="16" y="10" width="4" height="10"/>
        <polygon points="16,0 16,8 24,4"/>
      </g>
    </symbol>
  </defs>
</svg>
