        <rect x="6" y="6" width="4" height="4"/>
        <rect x="14" y="6" width="4" height="4"/>
        <rect x="2" y="10" width="4" height="4"/>
        <rect x="18" y="10" width="4" height="4"/>
        <rect x="10" y="10" width="4" height="12"/>
