        <rect x="6" y="10" width="12" height="4"/>
        <rect x="10" y="14" width="4" height="6"/>
        <rect x="3" y="20" width="18" height="3"/>
      </g>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
