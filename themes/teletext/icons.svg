<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Teletext: solid colour-cell block graphics, built on a coarse pixel
       grid (4-unit cells in a 24x24 box) — no curves, no outlines, no
       anti-aliasing, matching the real service's character-cell display.
       Every shape fills with currentColor and turns its stroke off, since
       block graphics were never drawn as outlines. Ids not listed here
       fall back to the generic outline sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <rect x="8" y="0" width="8" height="4"/>
        <rect x="4" y="4" width="16" height="4"/>
        <rect x="0" y="8" width="24" height="8"/>
        <rect x="0" y="16" width="8" height="8"/>
        <rect x="16" y="16" width="8" height="8"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <rect x="8" y="0" width="8" height="8"/>
        <rect x="0" y="8" width="24" height="8"/>
        <rect x="8" y="16" width="8" height="8"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <rect x="0" y="0" width="16" height="4"/>
        <rect x="0" y="12" width="16" height="4"/>
        <rect x="0" y="0" width="4" height="16"/>
        <rect x="12" y="0" width="4" height="16"/>
        <rect x="16" y="16" width="8" height="8"/>
      </g>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <rect x="0" y="0" width="4" height="4"/>
        <rect x="20" y="0" width="4" height="4"/>
        <rect x="4" y="4" width="4" height="4"/>
        <rect x="16" y="4" width="4" height="4"/>
        <rect x="8" y="8" width="8" height="8"/>
        <rect x="4" y="16" width="4" height="4"/>
        <rect x="16" y="16" width="4" height="4"/>
        <rect x="0" y="20" width="4" height="4"/>
        <rect x="20" y="20" width="4" height="4"/>
      </g>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <rect x="8" y="0" width="8" height="8"/>
        <rect x="2" y="10" width="20" height="4"/>
        <rect x="0" y="14" width="24" height="10"/>
      </g>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <rect x="8" y="0" width="8" height="4"/>
        <rect x="4" y="4" width="16" height="4"/>
        <rect x="2" y="8" width="20" height="8"/>
        <rect x="8" y="18" width="8" height="4"/>
      </g>
    </symbol>
  </defs>
</svg>
