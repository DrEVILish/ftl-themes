        <rect x="10" y="2" width="4" height="6"/>
        <rect x="10" y="16" width="4" height="6"/>
        <rect x="2" y="10" width="6" height="4"/>
        <rect x="16" y="10" width="6" height="4"/>
        <rect x="9" y="9" width="6" height="6"/>
