        <rect x="14" y="6" width="4" height="4"/>
        <rect x="14" y="14" width="4" height="4"/>
        <rect x="10" y="2" width="4" height="4"/>
        <rect x="10" y="18" width="4" height="4"/>
        <rect x="2" y="10" width="12" height="4"/>
