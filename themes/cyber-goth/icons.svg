<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Cyber-Goth: jagged industrial-asymmetric edge treatment. Every framed
       shape (rects/circles in the generic set) is redrawn as a polygon with
       ONE corner sliced off at a hard diagonal — the same single top-right
       "fang cut" the theme's own .ftl-btn clip-path uses (see theme.css),
       never a symmetric bevel on two corners like alienware. Circles become
       octagons for harsher, angular linework. stroke-linecap/linejoin are
       forced to square/miter on every symbol (core's .ftl-icon default is
       round/round), since a spiked, studded-leather silhouette reads wrong
       with soft rounded joints. Ids not listed here fall back to the
       generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <path d="M3 13 13 4 21 12"/>
        <polygon points="5,12 15,12 19,16 19,20 5,20"/>
        <rect x="10" y="15" width="4" height="5"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <polygon points="20.3,15.4 15.4,20.3 8.6,20.3 3.7,15.4 3.7,8.6 8.6,3.7 15.4,3.7 20.3,8.6"/>
        <rect x="10" y="10" width="4" height="4"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <polygon points="16,12.5 12.5,16 7.5,16 4,12.5 4,7.5 7.5,4 12.5,4 16,7.5"/>
        <path d="M15.5 15.5 21 21"/>
      </g>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <path d="M5 5 12 12 5 19"/>
        <path d="M19 5 12 12 19 19"/>
      </g>
    </symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <path d="M4 6h14"/>
        <path d="M4 12h16"/>
        <path d="M4 18h11"/>
      </g>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M4 13 9 18 20 5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
      <g stroke-linecap="square" stroke-linejoin="miter">
        <polygon points="13,3 21,20 3,20"/>
        <path d="M12 10v4"/>
        <rect x="11.3" y="16.3" width="1.4" height="1.4"/>
      </g>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
