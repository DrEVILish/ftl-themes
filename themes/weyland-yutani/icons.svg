<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Weyland-Yutani: industrial stencil glyphs. Square caps and miter joins
       are set on each <symbol> (inherited by its shapes), replacing the generic
       sprite's rounded default; circles become squares or chamfered polygons
       the way a machined label plate would draw them. Stroke-only, all colour
       comes from currentColor via the .icon rules. Every id not redrawn here
       falls back to the generic sprite. -->
