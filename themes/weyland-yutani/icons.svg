      <path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/><rect x="10" y="14" width="4" height="7"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" stroke-linecap="square" stroke-linejoin="miter">
