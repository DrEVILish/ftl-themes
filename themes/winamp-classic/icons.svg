<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- WinAmp Classic: thin LCD-segment-style line work — hardware-readout
       feel, minimal and slightly geometric/blocky where natural (evoking
       a tiny LCD display's segment glyphs), never curvy. This theme sets
       the icon stroke width to 1.5 globally, so shapes stay thin lines
       with no explicit stroke/fill here (inherited from .ftl-icon, same
       convention as the generic sprite). Circles become octagons; arcs
       become straight angled segments. Ids not listed here fall back to
       the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 12 12 5l8 7"/><path d="M6 12v7h12v-7"/><path d="M10 19v-5h4v5"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><rect x="10" y="2" width="4" height="3"/><rect x="10" y="19" width="4" height="3"/><rect x="2" y="10" width="3" height="4"/><rect x="19" y="10" width="3" height="4"/><rect x="6" y="6" width="12" height="12"/><rect x="10" y="10" width="4" height="4"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><path d="M4 8 8 4h6l4 4v6l-4 4H8l-4-4z"/><path d="M17 17l4 4"/></symbol>
