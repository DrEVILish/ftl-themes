<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Windows XP (Luna): glossy, two-tone icons — a currentColor fill for
       the base shape, a white highlight band for the gloss line Luna put
       on every filled surface (title bar, buttons, nav bar), and a thin
       currentColor outline to keep edges crisp. Ids not listed here fall
       back to the generic outline sprite. -->
