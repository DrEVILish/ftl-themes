<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Vaporwave: retro-futuristic geometric line work — thin uniform
       strokes (currentColor, fill:none, no baked stroke-width, sized via
       the shared icon stroke-width token like the generic set), rounded
       caps/joins for a sleek 80s-digital feel. A handful of icons carry a
       small pair of short parallel diagonal lines as a subtle nod to the
       theme's perspective-grid horizon — never on every icon, only where
       a ground-plane or motion cue fits naturally. Ids not listed here
