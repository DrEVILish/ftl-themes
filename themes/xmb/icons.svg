<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- XMB: sleek, minimal, slightly rounded geometric icons evoking the
       PS3/PSP Cross Media Bar's icon row — thin uniform strokes, open line
       silhouettes (no heavy fills; small dots/badges are the only solid
       accents), and circular/rounded-rect primitives throughout so the set
