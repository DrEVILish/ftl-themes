<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- MS-DOS (Norton Commander): blocky ASCII/text-mode-style glyphs — sharp
       right angles only (no arcs/curves anywhere, matching a 16-color VGA
       character cell), thick uniform 2.5px strokes, square caps and miter
       joins. Shapes read as box-drawing/line-drawing characters rather than
       naturalistic icons. Ids not listed here fall back to the generic
       sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M4 12 12 5l8 7"/>
        <path d="M6 12v8h12v-8"/>
        <rect x="10" y="15" width="4" height="5"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
        <rect x="9" y="9" width="6" height="6"/>
        <rect x="10.5" y="2" width="3" height="6"/>
        <rect x="10.5" y="16" width="3" height="6"/>
        <rect x="2" y="10.5" width="6" height="3"/>
        <rect x="16" y="10.5" width="6" height="3"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="4" y="4" width="11" height="11"/>
        <path d="M15 15 21 21"/>
      </g>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="9" y="4" width="6" height="6"/>
        <path d="M4 20v-3l4-4h8l4 4v3"/>
      </g>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="10.5" y="2.5" width="3" height="2.5"/>
        <path d="M6 9 8 5h8l2 4v6H6z"/>
        <rect x="5" y="15" width="14" height="2"/>
        <rect x="10.5" y="18.5" width="3" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24">
      <path d="M4 12h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M4 13 9 18 20 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <path d="M12 3 22 20H2Z"/>
        <path d="M12 9v4"/>
        <rect x="11" y="16" width="2" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="4" y="4" width="16" height="16"/>
        <path d="M12 10v6"/>
        <rect x="11" y="6" width="2" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="M5 9 12 16 19 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-chevron-up" viewBox="0 0 24 24">
      <path d="M5 15 12 8 19 15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="M15 5 8 12 15 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="M9 5 16 12 9 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24">
      <path d="M20 12H4M10 6 4 12l6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M4 12h16M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
      <path d="M12 20V4M6 10l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 24 24">
      <path d="M12 4v16M6 14l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <path d="M4 7h16"/>
        <path d="M9 7V4h6v3"/>
        <path d="M6 7 7 20h10l1-13"/>
        <path d="M10 10v7"/>
        <path d="M14 10v7"/>
      </g>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <path d="M4 20h4L20 8l-4-4L4 16z"/>
        <path d="M13 7l4 4"/>
      </g>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="4" y="4" width="16" height="16"/>
        <path d="M8 4v5h8V4"/>
        <rect x="7" y="13" width="10" height="7"/>
      </g>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M12 3v11"/>
        <path d="M6 10 12 16 18 10"/>
        <path d="M4 21h16"/>
      </g>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M12 21V10"/>
        <path d="M6 14 12 8 18 14"/>
        <path d="M4 3h16"/>
      </g>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M5 5h11v11H8"/>
        <path d="M11 13 8 16l3 3"/>
      </g>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="5" y="11" width="14" height="9"/>
        <path d="M8 11V7h8v4"/>
      </g>
    </symbol>
    <symbol id="icon-unlock" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="5" y="11" width="14" height="9"/>
        <path d="M8 11V7h6"/>
      </g>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
        <path d="M12 2v20"/>
        <path d="M4 6l16 12"/>
        <path d="M20 6 4 18"/>
      </g>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
        <rect x="3" y="8" width="18" height="11"/>
        <rect x="3" y="5" width="8" height="3"/>
      </g>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="6" y="3" width="12" height="18"/>
        <path d="M14 3v4h4"/>
      </g>
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="3" y="5" width="18" height="14"/>
        <path d="M3 6 12 13 21 6"/>
      </g>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="3" y="5" width="18" height="16"/>
        <path d="M3 10h18"/>
        <rect x="6" y="2" width="3" height="3"/>
        <rect x="15" y="2" width="3" height="3"/>
      </g>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square">
        <rect x="4" y="4" width="16" height="16"/>
        <path d="M12 8v4l3 2"/>
      </g>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M9 6h12"/>
        <path d="M9 12h12"/>
        <path d="M9 18h12"/>
        <rect x="3" y="5" width="2" height="2"/>
        <rect x="3" y="11" width="2" height="2"/>
        <rect x="3" y="17" width="2" height="2"/>
      </g>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
        <rect x="3" y="3" width="8" height="8"/>
        <rect x="13" y="3" width="8" height="8"/>
        <rect x="3" y="13" width="8" height="8"/>
        <rect x="13" y="13" width="8" height="8"/>
      </g>
    </symbol>
  </defs>
</svg>
