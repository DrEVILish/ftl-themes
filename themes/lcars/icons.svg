    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 21V10M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="4" y="1.7" width="16" height="2.8" rx="1.4" fill="currentColor"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
