      <path d="M12 7.5v5l3.5 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <rect x="8" y="5" width="13" height="2.6" rx="1.3" fill="currentColor"/>
      <rect x="8" y="10.7" width="13" height="2.6" rx="1.3" fill="currentColor"/>
      <rect x="8" y="16.4" width="13" height="2.6" rx="1.3" fill="currentColor"/>
      <circle cx="4" cy="6.3" r="1.6" fill="currentColor"/>
      <circle cx="4" cy="12" r="1.6" fill="currentColor"/>
      <circle cx="4" cy="17.7" r="1.6" fill="currentColor"/>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"/>
      <rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor"/>
      <rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor"/>
      <rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/>
