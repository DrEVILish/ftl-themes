<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- LCARS: built from LCARS' own geometric vocabulary — pill-ended
       rounded rects, sharp elbow curves, and solid colour-block fills —
       never naturalistic iconography. Every shape fills with currentColor
       so it reads as a candy-bar block, matching the app shell's own
       elbow bar. Ids not listed here fall back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <rect x="3" y="12" width="18" height="9" rx="4" fill="currentColor"/>
      <path d="M6 12v-2a6 6 0 0 1 12 0v2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="10" y="15" width="4" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
      <rect x="10.5" y="1" width="3" height="6" rx="1.5" fill="currentColor"/>
      <rect x="10.5" y="17" width="3" height="6" rx="1.5" fill="currentColor"/>
      <rect x="1" y="10.5" width="6" height="3" rx="1.5" fill="currentColor"/>
      <rect x="17" y="10.5" width="6" height="3" rx="1.5" fill="currentColor"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <rect x="3" y="3" width="14" height="14" rx="7" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <rect x="14" y="17.5" width="9" height="4" rx="2" fill="currentColor" transform="rotate(-45 14 17.5)"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <rect x="3" y="10.5" width="18" height="3" rx="1.5" fill="currentColor" transform="rotate(45 12 12)"/>
      <rect x="3" y="10.5" width="18" height="3" rx="1.5" fill="currentColor" transform="rotate(-45 12 12)"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4" fill="currentColor"/>
      <path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z" fill="currentColor"/>
      <rect x="10" y="19" width="4" height="2.4" rx="1.2" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
