      <path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-unlock" viewBox="0 0 24 24">
      <rect x="4" y="11" width="16" height="10" rx="3" fill="currentColor"/>
      <path d="M8 11V7a4 4 0 0 1 7.4-2.2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
