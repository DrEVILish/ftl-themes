    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M4 12h15M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
