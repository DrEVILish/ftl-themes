    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <rect x="3" y="8" width="18" height="11" rx="2.5" fill="currentColor"/>
      <rect x="3" y="5" width="8" height="4" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="8" y="9" width="8" height="2" rx="1" fill="currentColor"/>
      <rect x="8" y="13" width="8" height="2" rx="1" fill="currentColor"/>
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
