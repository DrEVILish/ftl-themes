      <rect x="3" y="6" width="18" height="4" rx="2" fill="currentColor"/>
      <rect x="7" y="2.5" width="2.6" height="4" rx="1.3" fill="currentColor"/>
      <rect x="14.4" y="2.5" width="2.6" height="4" rx="1.3" fill="currentColor"/>
