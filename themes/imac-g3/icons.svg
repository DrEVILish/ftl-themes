<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- iMac G3: soft, bulbous, translucent-plastic-era shapes. A thicker
       stroke (2.4, up from core's 2px default) with rounded caps/joins
       explicitly forced (never square/miter, matching the case's own
       "nothing here is sharp" rule from theme.css) and generous corner
       radii on every rect give a pillowy, candy-plastic outline instead of
       a thin technical line. Ids not listed here fall back to the generic
       sprite. -->
