      <g stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12c0-1 .3-1.6 1-2.2l6-5.3c.6-.5 1.4-.5 2 0l6 5.3c.7.6 1 1.2 1 2.2"/>
        <rect x="6" y="11" width="12" height="9" rx="4"/>
        <rect x="10" y="15" width="4" height="5" rx="2"/>
      </g>
    </symbol>
