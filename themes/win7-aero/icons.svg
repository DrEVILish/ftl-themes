<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Windows 7 Aero: soft glassy line work — rounded corners everywhere,
       and a two-weight stroke on most shapes: a thin outer contour (the
       default weight, inherited like the generic set) plus a bolder
       highlight arc traced along the TOP edge only (explicit, slightly
       heavier stroke-width, currentColor at reduced opacity) to suggest
       the glass catch-light this theme's CSS uses on every panel/button.
       Ids not listed here fall back to the generic outline sprite. -->
