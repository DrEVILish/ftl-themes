<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Hot Wheels: bold, dynamic, slightly aggressive linework. Every symbol
       forces a much heavier stroke (2.6, overriding core's 2px default —
       same "thicker than default" move as windows95's 2.6) and several
       boxy icons lean into an italic parallelogram silhouette (a slanted
       top edge) echoing the theme's italic uppercase type. A handful of
       motion-adjacent icons (play, chevron-right, check, bell, download,
       upload) carry 2-3 short speed-line/motion-streak marks trailing the
       glyph, at a lighter stroke weight so they read as trailing lines, not
       part of the main shape. Ids not listed here fall back to the generic
       sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g stroke-width="2.6">
        <path d="M3 11 12 4l9 7"/>
        <path d="M6.5 11h12l-1 9h-10z"/>
      </g>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <g stroke-width="2.6">
        <circle cx="12" cy="12" r="7"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </g>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g stroke-width="2.6">
        <circle cx="10" cy="10" r="6.5"/>
        <path d="m20 20-4-4"/>
      </g>
      <path d="M17 21l2-2M20.5 23l1-1" stroke-width="1.4"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 5 19 19" stroke-width="2.6"/>
      <path d="M19 5 7 18" stroke-width="2.6"/>
