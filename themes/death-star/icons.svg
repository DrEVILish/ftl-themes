<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Death Star Terminal: stark, structural Imperial-control-room glyphs.
       Thin uniform strokes (stroke-width 1, overriding core's 2px default —
       the same "hairline linework" register as the theme's white circuit
       grid), sharp right angles (square caps / miter joins, no curves
       unless the concept demands one, e.g. clock/power), and hexagonal or
       square panel framing around the glyph — echoing the theme's own
       bulkhead-grid panels. Minimal ornamentation: each icon is 2-3 marks,
       never more. Ids not listed here fall back to the generic sprite. -->
  <defs>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <g stroke-width="1" stroke-linecap="square" stroke-linejoin="miter">
        <polygon points="20.7,17 12,22 3.3,17 3.3,7 12,2 20.7,7"/>
        <path d="M8 11 12 8 16 11"/>
        <path d="M9 11v5h6v-5"/>
      </g>
    </symbol>
